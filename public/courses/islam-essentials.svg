<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="coverTitle">
  <title id="coverTitle">Islamic geometric cover — navy and gold</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <pattern id="girih" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <g fill="none" stroke="#22d3ee" stroke-opacity="0.14" stroke-width="1.2">
        <path d="M60 6 74 32 102 32 88 58 102 84 74 84 60 110 46 84 18 84 32 58 18 32 46 32Z"/>
        <path d="M60 24 84 60 60 96 36 60Z"/>
        <circle cx="60" cy="60" r="46"/>
        <path d="M0 60h24M96 60h24M60 0v24M60 96v24"/>
      </g>
    </pattern>
    <g id="star8">
      <path d="M0-60 14-24 50-24 22 0 34 36 0 14-34 36-22 0-50-24-14-24Z"/>
    </g>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#girih)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- central medallion -->
  <g transform="translate(600 338)">
    <circle r="190" fill="none" stroke="url(#gold)" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="160" fill="none" stroke="url(#teal)" stroke-opacity="0.28" stroke-width="1"/>
    <g stroke="url(#gold)" stroke-opacity="0.55" fill="none" stroke-width="1.2">
      <rect x="-118" y="-118" width="236" height="236"/>
      <rect x="-118" y="-118" width="236" height="236" transform="rotate(45)"/>
      <circle r="118"/>
    </g>
    <g fill="none" stroke="url(#gold)" stroke-width="1.4">
      <use href="#star8" transform="scale(1.55)" stroke="url(#teal)" stroke-opacity="0.45"/>
      <use href="#star8" transform="scale(1.1) rotate(45)"/>
      <use href="#star8" transform="scale(0.62)"/>
    </g>
    <circle r="34" fill="#f59e0b" fill-opacity="0.16" stroke="url(#gold)" stroke-width="1.5"/>
    <circle r="8" fill="url(#gold)"/>
  </g>

  <!-- side accents -->
  <g fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.2">
    <path d="M60 675V410l80-80 80 80v265"/>
    <path d="M1140 675V410l-80-80-80 80v265"/>
    <path d="M140 675V430l-40-40M1060 675V430l40-40"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.5">
    <circle cx="180" cy="160" r="2.5"/>
    <circle cx="1020" cy="150" r="2.5"/>
    <circle cx="300" cy="90" r="2"/>
    <circle cx="900" cy="95" r="2"/>
    <circle cx="120" cy="300" r="1.8"/>
    <circle cx="1080" cy="310" r="1.8"/>
  </g>

  <rect width="1200" height="675" fill="url(#vignette)"/>
  <path d="M0 0h1200v675H0Z" fill="none" stroke="url(#gold)" stroke-opacity="0.25" stroke-width="2"/>
</svg>
