<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">ETM Logo [dark]</title>
  <desc id="desc">Placeholder full ETM logo for light backgrounds: dark wordmark plus icon.</desc>
  <defs>
    <linearGradient id="logo-dark-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- icon mark -->
  <rect x="28" y="48" width="224" height="224" rx="56" fill="#f1f5f9" stroke="url(#logo-dark-accent)" stroke-width="8"/>
  <path d="M94 122 L146 170 L94 218" fill="none" stroke="url(#logo-dark-accent)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="170" y1="218" x2="232" y2="218" stroke="url(#logo-dark-accent)" stroke-width="20" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="296" y="176" fill="#0f172a" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="132" font-weight="900" letter-spacing="4">ETM</text>
  <text x="300" y="228" fill="#475569" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="5.4">EDUCATION TECHNOLOGY MARYAM</text>

  <!-- placeholder label -->
  <rect x="664" y="266" width="268" height="32" rx="16" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="798" y="288" fill="#6d28d9" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4" text-anchor="middle">ETM Logo [dark]</text>
</svg>
