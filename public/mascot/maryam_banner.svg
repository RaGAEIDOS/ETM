    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#94a3b8" stroke-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1920" height="600" fill="url(#bg)"/>
  <rect width="1920" height="600" fill="url(#grid)"/>
  <rect width="1920" height="600" fill="url(#glow)"/>

  <g fill="none" stroke="url(#stroke)" stroke-width="3" opacity="0.7">
    <path d="M1120 170l-48 46 48 46"/>
    <path d="M1180 170l48 46-48 46"/>
    <circle cx="1150" cy="430" r="54" stroke-opacity="0.35"/>
    <circle cx="1150" cy="430" r="86" stroke-opacity="0.18"/>
  </g>

  <g transform="translate(1450 82)" fill="none" stroke="url(#stroke)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 26c0-36 29-65 65-65s65 29 65 65v78c0 36-29 65-65 65s-65-29-65-65z" fill="#0b1026" stroke-opacity="0.9"/>
    <path d="M126 42c12-26 29-39 49-39s37 13 49 39v34c-15-14-31-21-49-21s-34 7-49 21z" fill="#8b5cf6" fill-opacity="0.28" stroke="none"/>
    <circle cx="158" cy="88" r="6" fill="#67e8f9" stroke="none"/>
